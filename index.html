<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="dashboard-header">
      <div class="theme-switch-wrap">
        <label class="theme-switch" for="theme-toggle">
          <span class="theme-switch__label theme-switch__label--light" aria-hidden="true">&#9728;</span>
          <input type="checkbox" id="theme-toggle" role="switch" aria-label="Toggle dark mode" />
          <span class="theme-switch__track" aria-hidden="true">
            <span class="theme-switch__thumb"></span>
          </span>
          <span class="theme-switch__label theme-switch__label--dark" aria-hidden="true">&#9790;</span>
        </label>
      </div>
    </header>
    <div class="dashboard">

      <!-- Greeting Widget -->
      <section id="greeting-widget" class="widget" aria-label="Greeting">
        <h1 id="greeting-message"></h1>
        <time id="greeting-time"></time>
        <p id="greeting-date"></p>
        <div class="name-display-area">
          <span id="name-display"></span>
          <button id="name-edit-btn" type="button" aria-label="Edit your name">Edit Name</button>
        </div>
        <div id="name-edit-form" class="name-edit-form" hidden>
          <label for="name-input" class="sr-only">Your name</label>
          <input
            type="text"
            id="name-input"
            placeholder="Enter your name..."
            maxlength="100"
            autocomplete="given-name"
          />
          <button id="name-save-btn" type="button" aria-label="Save name">Save</button>
          <button id="name-clear-btn" type="button" aria-label="Clear name">Clear</button>
        </div>
      </section>

      <!-- Focus Timer Widget -->
      <section id="timer-widget" class="widget" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" aria-live="off">25:00</div>
        <p id="timer-end-message" hidden aria-live="assertive">Session complete! Great work.</p>
        <div class="timer-controls">
          <button id="timer-start" type="button" aria-label="Start timer">Start</button>
          <button id="timer-stop"  type="button" aria-label="Stop timer">Stop</button>
          <button id="timer-reset" type="button" aria-label="Reset timer">Reset</button>
        </div>
      </section>

      <!-- To-Do List Widget -->
      <section id="todo-widget" class="widget" aria-label="To-Do List">
        <h2>To-Do List</h2>
        <div class="todo-form">
          <label for="todo-input" class="sr-only">New task description</label>
          <input
            type="text"
            id="todo-input"
            placeholder="Add a new task..."
            maxlength="500"
            aria-describedby="todo-input-error"
            autocomplete="off"
          />
          <button id="todo-add-btn" type="button" aria-label="Add task">Add</button>
        </div>
        <span id="todo-input-error" role="alert" aria-live="polite" hidden></span>
        <ul id="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- Quick Links Widget -->
      <section id="links-widget" class="widget" aria-label="Quick Links">
        <h2>Quick Links</h2>
        <div class="links-form">
          <label for="link-label-input" class="sr-only">Link label</label>
          <input
            type="text"
            id="link-label-input"
            placeholder="Label..."
            autocomplete="off"
            aria-describedby="link-form-error"
          />
          <label for="link-url-input" class="sr-only">Link URL</label>
          <input
            type="text"
            id="link-url-input"
            placeholder="https://..."
            autocomplete="off"
            aria-describedby="link-form-error"
          />
          <button id="link-add-btn" type="button" aria-label="Add link">Add</button>
        </div>
        <span id="link-form-error" role="alert" aria-live="polite" hidden></span>
        <div id="links-list" aria-label="Quick links list"></div>
      </section>

    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
